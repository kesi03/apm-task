steps:
  - bash: |
      APM_TRACE_ID=$(node -e "process.stdout.write(require('crypto').randomBytes(16).toString('hex'))")
      echo "##vso[task.setvariable variable=APM_TRACE_ID]$APM_TRACE_ID"
      echo "Elastic APM: Pipeline start"
    displayName: "Elastic APM Pipeline Start"

  - bash: |
      echo "Elastic APM: Pipeline end"
    displayName: "Elastic APM Pipeline End"
