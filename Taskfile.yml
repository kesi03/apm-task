version: '3'

vars:
  IMAGE: mockholm/ci-apm-trace
  TRACE_NAME: my-pipeline
  BUILD_ID: '1'
  PROFILE: npm
  NAMESPACE: default

tasks:
  default:
    desc: Install dependencies and build
    cmds:
      - task: install
      - task: build

  install:
    desc: Install dependencies
    cmds:
      - npm install

  build:
    desc: Compile TypeScript to dist/
    deps: [install]
    cmds:
      - npm run build

  typecheck:
    desc: Run the TypeScript compiler without emitting
    deps: [install]
    cmds:
      - npm run typecheck

  clean:
    desc: Remove the compiled dist/ directory
    cmds:
      - node -e "require('fs').rmSync('dist',{recursive:true,force:true})"

  start:
    desc: Run the CLI
    deps: [build]
    cmds:
      - node dist/cli.js --trace-name {{.TRACE_NAME}} --build-id {{.BUILD_ID}}

  cli:
    desc: Run the one-shot CLI client with the {{.PROFILE}} profile
    cmds:
      - ci-apm-trace --trace-name {{.TRACE_NAME}} --build-id {{.BUILD_ID}} --ci_platform {{.PROFILE}}

  pre:
    desc: Start a trace (pre) - prints APM_* env vars to hand off to main/post ({{.PROFILE}} profile)
    cmds:
      - ci-apm-trace pre --trace-name {{.TRACE_NAME}} --ci_platform {{.PROFILE}}

  main:
    desc: Record the main task execution span ({{.PROFILE}} profile)
    cmds:
      - ci-apm-trace main --trace-name {{.TRACE_NAME}} --ci_platform {{.PROFILE}}

  post:
    desc: End the trace (post) - transaction, error, and metrics ({{.PROFILE}} profile)
    cmds:
      - ci-apm-trace post --trace-name {{.TRACE_NAME}} --ci_platform {{.PROFILE}}

  test:
    desc: Smoke test CLI success and failure exit codes
    deps: [build]
    cmds:
      - node -e "const {spawnSync}=require('child_process');const run=a=>spawnSync(process.execPath,['dist/cli.js',...a],{stdio:'inherit'}).status;const s=run(['--trace-name','smoke','--build-id','1']);const f=run(['--trace-name','smoke','--build-id','1','--fail']);console.log('success='+s+' failure='+f);if(s!==0||f!==1)process.exit(1)"

  test:proxy:
    desc: Verify traces are routed through an HTTP(S) proxy via HTTP_PROXY/HTTPS_PROXY/NO_PROXY
    deps: [build]
    cmds:
      - node scripts/test-proxy.js

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -t {{.IMAGE}} .

  cli:docker:
    desc: Run the one-shot CLI client in the Docker image (docker profile)
    cmds:
      - docker run --rm -e ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} -e ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} -e ELASTIC_APM_API_KEY={{.ELASTIC_APM_API_KEY}} {{.IMAGE}} --trace-name {{.TRACE_NAME}} --build-id {{.BUILD_ID}} --ci_platform docker

  pre:docker:
    desc: Start a trace inside Docker (docker profile) - prints APM_* env vars to hand off to main/post
    cmds:
      - docker run --rm -e ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} -e ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} -e ELASTIC_APM_API_KEY={{.ELASTIC_APM_API_KEY}} {{.IMAGE}} pre --trace-name {{.TRACE_NAME}} --ci_platform docker

  main:docker:
    desc: Record the main task execution span inside Docker (docker profile)
    cmds:
      - docker run --rm -e ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} -e ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} -e ELASTIC_APM_API_KEY={{.ELASTIC_APM_API_KEY}} -e APM_TRACE_ID={{.APM_TRACE_ID}} -e APM_TRANSACTION_ID={{.APM_TRANSACTION_ID}} -e APM_SPAN_ID={{.APM_SPAN_ID}} -e APM_JOB_START_MS={{.APM_JOB_START_MS}} {{.IMAGE}} main --trace-name {{.TRACE_NAME}} --ci_platform docker

  post:docker:
    desc: End the trace inside Docker (docker profile)
    cmds:
      - docker run --rm -e ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} -e ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} -e ELASTIC_APM_API_KEY={{.ELASTIC_APM_API_KEY}} -e APM_TRACE_ID={{.APM_TRACE_ID}} -e APM_TRANSACTION_ID={{.APM_TRANSACTION_ID}} -e APM_SPAN_ID={{.APM_SPAN_ID}} -e APM_JOB_START_MS={{.APM_JOB_START_MS}} {{.IMAGE}} post --trace-name {{.TRACE_NAME}} --ci_platform docker

  k8s:apply:
    desc: Create the k8s Job from k8s.yml (runs pre -> main -> post with the k8s profile)
    cmds:
      - kubectl apply -f k8s.yml -n {{.NAMESPACE}}

  k8s:logs:
    desc: Follow the logs of the k8s Job
    cmds:
      - kubectl logs job/ci-apm-trace -n {{.NAMESPACE}} -f

  k8s:delete:
    desc: Delete the k8s Job
    cmds:
      - kubectl delete -f k8s.yml -n {{.NAMESPACE}}

  cli:k8s:
    desc: Run the one-shot CLI client in a Kubernetes Pod (k8s profile)
    cmds:
      - kubectl run ci-apm-trace-cli --image={{.IMAGE}} --restart=Never -n {{.NAMESPACE}} --env=APM_CI_PLATFORM=k8s --env=ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} --env=ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} -- node dist/cli.js --trace-name {{.TRACE_NAME}} --build-id {{.BUILD_ID}} --ci_platform k8s

  pre:k8s:
    desc: Start a trace in a Kubernetes Pod (k8s profile) - prints APM_* env vars to hand off to main/post
    cmds:
      - kubectl run ci-apm-trace-pre --image={{.IMAGE}} --restart=Never -n {{.NAMESPACE}} --env=APM_CI_PLATFORM=k8s --env=ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} --env=ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} -- node dist/cli.js pre --trace-name {{.TRACE_NAME}} --ci_platform k8s

  main:k8s:
    desc: Record the main task execution span in a Kubernetes Pod (k8s profile)
    cmds:
      - kubectl run ci-apm-trace-main --image={{.IMAGE}} --restart=Never -n {{.NAMESPACE}} --env=APM_CI_PLATFORM=k8s --env=ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} --env=ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} --env=APM_TRACE_ID={{.APM_TRACE_ID}} --env=APM_TRANSACTION_ID={{.APM_TRANSACTION_ID}} --env=APM_SPAN_ID={{.APM_SPAN_ID}} --env=APM_JOB_START_MS={{.APM_JOB_START_MS}} -- node dist/cli.js main --trace-name {{.TRACE_NAME}} --ci_platform k8s

  post:k8s:
    desc: End the trace in a Kubernetes Pod (k8s profile)
    cmds:
      - kubectl run ci-apm-trace-post --image={{.IMAGE}} --restart=Never -n {{.NAMESPACE}} --env=APM_CI_PLATFORM=k8s --env=ELASTIC_APM_SERVER_URL={{.ELASTIC_APM_SERVER_URL}} --env=ELASTIC_APM_SECRET_TOKEN={{.ELASTIC_APM_SECRET_TOKEN}} --env=APM_TRACE_ID={{.APM_TRACE_ID}} --env=APM_TRANSACTION_ID={{.APM_TRANSACTION_ID}} --env=APM_SPAN_ID={{.APM_SPAN_ID}} --env=APM_JOB_START_MS={{.APM_JOB_START_MS}} -- node dist/cli.js post --trace-name {{.TRACE_NAME}} --ci_platform k8s

  package:azure:
    desc: Package the Azure DevOps task extension into a .vsix
    deps: [build]
    cmds:
      - npm run icons
      - npm run package:azure

  publish:azure:
    desc: Publish the Azure DevOps task extension to the Marketplace
    deps: [package:azure]
    cmds:
      - npx tfx extension publish --manifest-globs vss-extension.json --token {{.AZURE_DEVOPS_TOKEN}}

  bundle:github:
    desc: Bundle the GitHub Action into a self-contained dist/cli.js via ncc
    deps: [build]
    cmds:
      - npm run bundle:github

  publish:github:
    desc: Publish the GitHub Action (bundle, tag, and create a Marketplace release)
    deps: [bundle:github]
    cmds:
      - npm version {{.VERSION}} --no-git-tag-version
      - git add -f dist package.json package-lock.json
      - "git commit -m 'chore(release): v{{.VERSION}}'"
      - git tag v{{.VERSION}}
      - git push origin HEAD --follow-tags
      - gh release create v{{.VERSION}} --generate-notes
