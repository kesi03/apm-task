# Kubernetes Job that runs the ci-apm-trace client with the k8s profile.
#
# The pod runs the full pre -> main -> post lifecycle in one shell so the APM_*
# trace state generated by `pre` is handed off to `main` and `post` natively.
#
# Required Secret (create before applying):
#   kubectl create secret generic apm-secret \
#     --from-literal=server-url=https://<deployment-id>.apm.<region>.gcp.elastic.cloud:443 \
#     --from-literal=secret-token=<your-secret-or-api-key>
#
# For a cluster that does not see the locally built image (e.g. minikube/kind),
# push the image to a registry, change `image` below, and drop the
# `imagePullPolicy: Never` line.
apiVersion: batch/v1
kind: Job
metadata:
  name: ci-apm-trace
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ci-apm-trace
          image: ci-apm-trace
          imagePullPolicy: Never
          env:
            - name: APM_CI_PLATFORM
              value: k8s
            - name: TRACE_NAME
              value: k8s-pipeline
            - name: ELASTIC_APM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: apm-secret
                  key: server-url
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-secret
                  key: secret-token
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              set -e
              eval "$(node dist/cli.js pre --trace-name "$TRACE_NAME" --ci_platform k8s)"
              node dist/cli.js main --trace-name "$TRACE_NAME" --ci_platform k8s
              node dist/cli.js post --trace-name "$TRACE_NAME" --ci_platform k8s
