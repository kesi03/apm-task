# Runs the ci-apm-trace client with the npm profile.
#
# Required pipeline variables:
#   ELASTIC_APM_SERVER_URL     (plain)    e.g. https://<deployment-id>.apm.<region>.gcp.elastic.cloud:443
#   ELASTIC_APM_SECRET_TOKEN   (secret)   APM secret token or Elastic API key
#   traceName                  (plain)    optional, defaults to 'npm'
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  traceName: npm

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '20'
    displayName: 'Install Node.js 20'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: |
      node dist/cli.js pre --trace-name "$(traceName)" --ci_platform npm | tee apm.env
      grep '^export APM_' apm.env | while IFS='=' read -r k v; do
        key="${k#export }"
        echo "##vso[task.setvariable variable=${key}]${v}"
      done
    displayName: 'Start trace (pre)'
    env:
      ELASTIC_APM_SERVER_URL: $(ELASTIC_APM_SERVER_URL)
      ELASTIC_APM_SECRET_TOKEN: $(ELASTIC_APM_SECRET_TOKEN)

  - script: npm run typecheck
    displayName: 'Main work'

  - script: node dist/cli.js main --trace-name "$(traceName)" --ci_platform npm
    displayName: 'Record main task span'
    env:
      ELASTIC_APM_SERVER_URL: $(ELASTIC_APM_SERVER_URL)
      ELASTIC_APM_SECRET_TOKEN: $(ELASTIC_APM_SECRET_TOKEN)

  - script: node dist/cli.js post --trace-name "$(traceName)" --ci_platform npm
    displayName: 'End trace (post)'
    env:
      ELASTIC_APM_SERVER_URL: $(ELASTIC_APM_SERVER_URL)
      ELASTIC_APM_SECRET_TOKEN: $(ELASTIC_APM_SECRET_TOKEN)
