name: 'CI APM Trace'
description: 'Sends CI pipeline traces to Elastic APM'
author: 'kester.simm.mockholm@outlook.com'
branding:
  icon: 'activity'
  color: 'blue'
inputs:
  trace-name:
    description: 'Name of the pipeline trace'
    required: false
    default: 'github-action'
  fail:
    description: 'Force the trace to end as a failure'
    required: false
    default: 'false'
  debug:
    description: 'Show the APM server response in the job log'
    required: false
    default: 'false'
  apm-server:
    description: 'Elastic APM server URL. Overrides the ELASTIC_APM_SERVER_URL environment variable.'
    required: false
  apm-token:
    description: 'Elastic APM secret token. Overrides the ELASTIC_APM_SECRET_TOKEN environment variable.'
    required: false
runs:
  using: 'node20'
  main: 'dist/github-wrapper.js'
